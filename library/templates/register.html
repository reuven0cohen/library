<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Create account | Library Control Panel</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body class="login-page">
    <main class="login-shell">
        <section class="login-panel">
            <p class="eyebrow">LIBRARY OPERATIONS</p>
            <h1>Create account.</h1>
            <p class="login-copy">Register an account to access the library control panel.</p>
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert {{ category }}">{{ message }}</div>
                    {% endfor %}
                {% endif %}
            {% endwith %}
            <form class="form login-form" method="post">
                <label>Username<input name="username" minlength="3" autocomplete="username" required autofocus></label>
                <label>Password<input name="password" type="password" minlength="6" autocomplete="new-password" required></label>
                <label>Confirm password<input name="confirmation" type="password" minlength="6" autocomplete="new-password" required></label>
                <button class="button" type="submit">Create account</button>
            </form>
            <p class="login-hint">Already registered? <a href="{{ url_for('login') }}">Sign in</a></p>
        </section>
    </main>
</body>
</html>
